{
  "openapi": "3.1.0",
  "info": {"title": "BrokerKit MCP Operation Documents", "version": "1.0.0"},
  "paths": {},
  "components": {
    "schemas": {
      "State": {"type": "string", "enum": ["pending", "approved", "executing", "succeeded", "failed", "denied", "expired", "canceled"]},
      "Presentation": {"type": "object", "additionalProperties": false, "required": ["title"], "properties": {"title": {"type": "string", "minLength": 1, "maxLength": 160}, "summary": {"type": "string", "maxLength": 500}}},
      "OperationError": {"type": "object", "additionalProperties": false, "required": ["code", "message"], "properties": {"code": {"type": "string", "minLength": 1, "maxLength": 64}, "message": {"type": "string", "minLength": 1, "maxLength": 500}}},
      "Operation": {
        "type": "object", "additionalProperties": false,
        "required": ["api_version", "id", "request_id", "operation", "state", "revision", "created_at", "updated_at", "presentation"],
        "properties": {
          "api_version": {"type": "string", "const": "brokerkit.io/mcp-operation/v1"},
          "id": {"type": "string", "minLength": 1, "maxLength": 128},
          "request_id": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"},
          "operation": {"type": "string", "minLength": 1, "maxLength": 128},
          "state": {"$ref": "#/components/schemas/State"},
          "revision": {"type": "integer", "minimum": 1},
          "created_at": {"type": "string", "format": "date-time"},
          "updated_at": {"type": "string", "format": "date-time"},
          "terminal_at": {"type": "string", "format": "date-time"},
          "presentation": {"$ref": "#/components/schemas/Presentation"},
          "result": {"type": "object", "maxProperties": 128},
          "error": {"$ref": "#/components/schemas/OperationError"}
        }
      },
      "OperationPage": {
        "type": "object", "additionalProperties": false,
        "required": ["api_version", "operations", "next_cursor"],
        "properties": {
          "api_version": {"type": "string", "const": "brokerkit.io/mcp-operation-page/v1"},
          "operations": {"type": "array", "maxItems": 50, "items": {"$ref": "#/components/schemas/Operation"}},
          "next_cursor": {"type": ["string", "null"], "minLength": 1, "maxLength": 128}
        }
      },
      "RequestIDConflict": {
        "type": "object", "additionalProperties": false,
        "required": ["code", "message", "existing"],
        "properties": {
          "code": {"type": "string", "const": "request_id_conflict"},
          "message": {"type": "string", "const": "request_id is already bound to a different operation"},
          "existing": {
            "type": "object", "additionalProperties": false,
            "required": ["id", "request_id", "operation", "state", "revision"],
            "properties": {
              "id": {"type": "string", "minLength": 1, "maxLength": 128},
              "request_id": {"type": "string", "minLength": 1, "maxLength": 128},
              "operation": {"type": "string", "minLength": 1, "maxLength": 128},
              "state": {"$ref": "#/components/schemas/State"},
              "revision": {"type": "integer", "minimum": 1}
            }
          }
        }
      }
    }
  }
}
