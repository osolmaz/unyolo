name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go mod download
      - run: go fmt ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./scripts/check-go-coverage.sh
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: golangci-lint run
      - run: go install github.com/dutifuldev/slophammer/go/cmd/slophammer-go@v0.4.0
      - run: slophammer-go dry .
      - run: slophammer-go crap .
      - run: slophammer-go mutate . --scan
      - run: slophammer-go check .
