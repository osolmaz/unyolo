name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go mod download
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go mod verify
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - run: ./scripts/check-architecture.sh
      - run: ./scripts/check-github-generated.sh
      - run: ./scripts/check-sql.sh
      - run: go test ./protocol
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./scripts/check-go-coverage.sh
      - run: GOTOOLCHAIN=go1.26.5 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run
      - run: GOTOOLCHAIN=go1.26.5 go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - run: GOTOOLCHAIN=go1.26.5 go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: gitleaks git --no-banner --redact .
      - run: go install github.com/dutifuldev/slophammer/go/cmd/slophammer-go@v0.4.0
      - name: Slophammer DRY gates
        run: |
          slophammer-go dry .
          (cd brokers/huggingface && slophammer-go dry .)
          (cd brokers/github && slophammer-go dry .)
          (cd brokers/sudo && slophammer-go dry .)
      - name: Slophammer complexity gates
        run: |
          slophammer_binary="$(command -v slophammer-go)"
          slophammer-go() {
            SLOPHAMMER_GO="$slophammer_binary" ./scripts/check-github-crap.sh
          }
          # The wrapper verifies every score against an exact ceiling and rejects tool failures.
          slophammer-go crap . --max-score 8
          (cd brokers/huggingface && "$slophammer_binary" crap . --max-score 8)
      - name: mutate4go gate (opt-in)
        if: ${{ vars.RUN_MUTATION == 'true' }}
        run: ./scripts/check-mutation.sh
      - name: Slophammer complete gates
        run: slophammer-go check .

  openclaw-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter openclaw-brokerkit exec playwright install --with-deps
      - run: pnpm --filter openclaw-brokerkit test:browser
      - run: npm pack --dry-run
        working-directory: plugins/openclaw
      - run: pnpm --filter openclaw-brokerkit test:package
