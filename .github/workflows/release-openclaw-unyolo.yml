name: Release openclaw-unyolo

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: release-openclaw-unyolo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish npm package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'openclaw-unyolo/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");

          const pkg = JSON.parse(readFileSync("plugins/openclaw/package.json", "utf8"));
          const errors = [];

          if (pkg.name !== "openclaw-unyolo") {
            errors.push(`package name must be openclaw-unyolo; found ${pkg.name ?? "<missing>"}`);
          }
          if (pkg.private === true) {
            errors.push("package must not be private");
          }
          if (!pkg.version) {
            errors.push("package version is missing");
          }
          if (process.env.EVENT_NAME === "release") {
            const expected = `openclaw-unyolo/v${pkg.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              errors.push(`release tag must be ${expected}; found ${process.env.RELEASE_TAG}`);
            }
          }

          if (errors.length > 0) {
            for (const error of errors) console.error(error);
            process.exit(1);
          }

          console.log(`Release metadata valid for ${pkg.name}@${pkg.version}`);
          NODE

      - name: Ensure version is not already published
        working-directory: plugins/openclaw
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "openclaw-unyolo@$package_version" version 2>/dev/null || true)"

          if [ "$published_version" = "$package_version" ]; then
            echo "openclaw-unyolo@$package_version is already published on npm." >&2
            exit 1
          fi

          echo "Publishing openclaw-unyolo@$package_version"

      - run: pnpm --filter openclaw-unyolo check
      - run: pnpm --filter openclaw-unyolo test
      - run: pnpm --filter openclaw-unyolo build
      - run: pnpm --filter openclaw-unyolo exec playwright install --with-deps
      - run: pnpm --filter openclaw-unyolo test:browser
      - run: pnpm --filter openclaw-unyolo test:package

      - name: Inspect package contents
        working-directory: plugins/openclaw
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: plugins/openclaw
        run: npm publish --access public --provenance
