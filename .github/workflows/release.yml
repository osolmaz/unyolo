name: Release broker

on:
  push:
    tags:
      - "hf-broker/v*"
      - "gh-broker/v*"
      - "sudo-broker/v*"
      - "unyolo-telegram/v*"
      - "unyolo/v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      broker: ${{ steps.component.outputs.broker }}
      command: ${{ steps.component.outputs.command }}
      companions: ${{ steps.component.outputs.companions }}
      path_companions: ${{ steps.component.outputs.path_companions }}
      directory: ${{ steps.component.outputs.directory }}
      extra: ${{ steps.component.outputs.extra }}
      files: ${{ steps.component.outputs.files }}
      data_files: ${{ steps.component.outputs.data_files }}
      version: ${{ steps.component.outputs.version }}
    steps:
      - name: Select component
        id: component
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          version=${tag#*/}
          companions=""
          path_companions=""
          extra=""
          files=""
          data_files=""
          case "$tag" in
            hf-broker/*)
              echo "broker=hf-broker" >> "$GITHUB_OUTPUT"
              echo "directory=brokers/huggingface" >> "$GITHUB_OUTPUT"
              echo "command=./cmd/hf-broker" >> "$GITHUB_OUTPUT"
              extra="--extra-command=git-credential-unyolo=../../cmd/git-credential-unyolo"
              path_companions="git-credential-unyolo"
              ;;
            gh-broker/*)
              echo "broker=gh-broker" >> "$GITHUB_OUTPUT"
              echo "directory=brokers/github" >> "$GITHUB_OUTPUT"
              echo "command=./cmd/gh-broker" >> "$GITHUB_OUTPUT"
              extra="--extra-command=git-credential-unyolo=../../cmd/git-credential-unyolo"
              path_companions="git-credential-unyolo"
              ;;
            sudo-broker/*)
              echo "broker=sudo-broker" >> "$GITHUB_OUTPUT"
              echo "directory=brokers/sudo" >> "$GITHUB_OUTPUT"
              echo "command=./cmd/sudo-broker" >> "$GITHUB_OUTPUT"
              extra="--extra-command=sudo-broker-exec=./cmd/sudo-broker-exec"
              companions="sudo-broker-exec"
              ;;
            unyolo-telegram/*)
              echo "broker=unyolo-telegram" >> "$GITHUB_OUTPUT"
              echo "directory=." >> "$GITHUB_OUTPUT"
              echo "command=./cmd/unyolo-telegram" >> "$GITHUB_OUTPUT"
              ;;
            unyolo/*)
              echo "broker=unyolo" >> "$GITHUB_OUTPUT"
              echo "directory=." >> "$GITHUB_OUTPUT"
              echo "command=./cmd/unyolo" >> "$GITHUB_OUTPUT"
              extra="--extra-command=openclaw-unyolo-setup=./plugins/openclaw/deployment/cmd/openclaw-unyolo-setup"
              files="--extra-file=providers/github.json=brokers/github/deployment/provider.json --extra-file=providers/huggingface.json=brokers/huggingface/deployment/provider.json --extra-file=providers/sudo.json=brokers/sudo/deployment/provider.json"
              data_files="providers/github.json providers/huggingface.json providers/sudo.json"
              companions="openclaw-unyolo-setup"
              ;;
            *) exit 64 ;;
          esac
          echo "companions=$companions" >> "$GITHUB_OUTPUT"
          echo "path_companions=$path_companions" >> "$GITHUB_OUTPUT"
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "data_files=$data_files" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build reproducible archives
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/unyolo-release \
            --broker '${{ needs.prepare.outputs.broker }}' \
            --directory '${{ needs.prepare.outputs.directory }}' \
            --command '${{ needs.prepare.outputs.command }}' \
            --version '${{ needs.prepare.outputs.version }}' \
            --dist "$GITHUB_WORKSPACE/dist" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            ${{ needs.prepare.outputs.extra }} \
            ${{ needs.prepare.outputs.files }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate complete checksums
        shell: bash
        run: |
          set -euo pipefail
          cp install/bootstrap-root.sh dist/unyolo-bootstrap-root.sh
          cp install/runtime-release.pub dist/unyolo-runtime-release.pub
          cd dist
          sha256sum ./*.tar.gz ./unyolo-bootstrap-root.sh ./unyolo-runtime-release.pub | sed 's#  \./#  #' > checksums.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      - name: Verify published release
        env:
          BROKER: ${{ needs.prepare.outputs.broker }}
          REPO: ${{ github.repository }}
          TAG_PREFIX: ${{ needs.prepare.outputs.broker }}/
          VERSION: ${{ github.ref_name }}
          UNYOLO_VERIFY_ONLY: "true"
          UNYOLO_VERIFY_RELEASE_SET: "true"
          COMPANION_BINARIES: ${{ needs.prepare.outputs.companions }}
          PATH_COMPANION_BINARIES: ${{ needs.prepare.outputs.path_companions }}
          DATA_FILES: ${{ needs.prepare.outputs.data_files }}
          DATA_DIR: /tmp/unyolo-release-data
          GH_TOKEN: ${{ github.token }}
        run: sh install/install.sh
