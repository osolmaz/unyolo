name: Release Docker image

on:
  push:
    tags:
      - "hf-broker/v*"
      - "gh-broker/v*"
      - "sudo-broker/v*"
      - "unyolo-pairing/v*"
      - "unyolo-client-init/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. gh-broker/v1.2.3)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.select.outputs.image_name }}
      dockerfile: ${{ steps.select.outputs.dockerfile }}
      version: ${{ steps.select.outputs.version }}
      component: ${{ steps.select.outputs.component }}
    steps:
      - name: Select component
        id: select
        shell: bash
        env:
          FORCED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag=${FORCED_TAG:-$GITHUB_REF_NAME}
          version=${tag#*/}
          case "$tag" in
            gh-broker/*)
              echo "image_name=gh-broker" >> "$GITHUB_OUTPUT"
              echo "dockerfile=brokers/github/deployment/docker/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "component=gh-broker" >> "$GITHUB_OUTPUT"
              ;;
            hf-broker/*)
              echo "image_name=hf-broker" >> "$GITHUB_OUTPUT"
              echo "dockerfile=brokers/huggingface/deployment/docker/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "component=hf-broker" >> "$GITHUB_OUTPUT"
              ;;
            sudo-broker/*)
              echo "image_name=sudo-broker" >> "$GITHUB_OUTPUT"
              echo "dockerfile=brokers/sudo/deployment/docker/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "component=sudo-broker" >> "$GITHUB_OUTPUT"
              ;;
            unyolo-pairing/*)
              echo "image_name=unyolo-pairing" >> "$GITHUB_OUTPUT"
              echo "dockerfile=cmd/unyolo-pairing/docker/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "component=unyolo-pairing" >> "$GITHUB_OUTPUT"
              ;;
            unyolo-client-init/*)
              echo "image_name=unyolo-client-init" >> "$GITHUB_OUTPUT"
              echo "dockerfile=cmd/unyolo-client-init/docker/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "component=unyolo-client-init" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported tag $tag" >&2
              exit 64
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Log into GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.unyolo.component=${{ needs.prepare.outputs.component }}
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6
        with:
          context: .
          file: ${{ needs.prepare.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_name }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ needs.prepare.outputs.image_name }}
          TAG: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "digest=${DIGEST}"
          } > "dist/${TAG//\//-}.digest"
          echo "${IMAGE}:${TAG}@${DIGEST}"
      - name: Upload digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ needs.prepare.outputs.image_name }}
          path: dist/*.digest
          if-no-files-found: error
          retention-days: 30
