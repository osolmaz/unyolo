go:
  exclude:
    - pattern: "**/testdata/**"
      reason: executable test fixtures are covered through their consuming integration tests
    - pattern: "brokers/**"
      reason: each broker has an independently enforced Slophammer configuration
    - pattern: "plugins/**"
      reason: TypeScript packages use their native lint, typecheck, test, and build gates
    - pattern: "cmd/unyolo-*/**"
      reason: process entrypoints only parse flags, handle signals, and delegate to tested tooling packages
    - pattern: "cmd/unyolo/**"
      reason: deployment orchestration is enforced by the dedicated host coverage, race, and clean-host integration gates
    - pattern: "deployment/**"
      reason: security validation intentionally uses explicit branches and is enforced by the dedicated host coverage, race, and clean-host integration gates
    - pattern: "git/client/**"
      reason: guided Git client lifecycle is enforced by focused coverage, race, and integration tests
    - pattern: "internal/config/client/**"
      reason: deployment client discovery is enforced by the dedicated host coverage, race, and clean-host integration gates
    - pattern: "internal/config/secretfile/**"
      reason: setup secret parsing is enforced by focused coverage and race tests
    - pattern: "internal/host/**"
      reason: host lifecycle code is enforced by the dedicated host coverage, race, and clean-host integration gates
    - pattern: "internal/pairing/**"
      reason: pairing lifecycle code is enforced by the dedicated host coverage and race gates
    - pattern: "internal/secretset/**"
      reason: setup secret aggregation is enforced by focused coverage and race tests
    - pattern: "internal/terminal/setup/**"
      reason: interactive setup is enforced by focused unit, accessibility, and pseudo-terminal race tests
    - pattern: "internal/tooling/release/**"
      reason: release source generation is enforced by focused coverage and release tests
    - pattern: "protocol/pairing/**"
      reason: pairing protocol validation is enforced by focused coverage and race tests
    - pattern: "setup/**"
      reason: guided setup is enforced by the dedicated host coverage, race, and clean-host integration gates
    - pattern: "transport/endpoint/**"
      reason: setup endpoint validation is enforced by focused coverage and race tests
    - pattern: "transport/http/client/**"
      reason: setup endpoint clients are enforced by focused coverage and race tests
    - pattern: "cmd/git-credential-unyolo/**"
      reason: the process entrypoint only delegates to the tested git/client package
    - pattern: "internal/storage/state/internal/dbsql/**"
      reason: deterministic sqlc-generated database bindings are checked by the pinned generation gate
    - pattern: "broker/conformance/**"
      reason: reusable black-box test harness code is exercised by consumer repositories rather than shipped at runtime
    - pattern: protocol/operatorwire/generated.go
      reason: Deterministic oapi-codegen output is verified by scripts/check-protocol.sh.
    - pattern: protocol/agentwire/generated.go
      reason: Deterministic oapi-codegen output is verified by scripts/check-protocol.sh.
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "**/*_test.go"
      - pattern: "brokers/**"
        reason: each broker has an independently enforced Slophammer configuration
      - pattern: "cmd/unyolo-*/**"
        reason: process entrypoints only parse flags, handle signals, and delegate to tested tooling packages
      - pattern: "cmd/unyolo/**"
        reason: deployment orchestration is enforced by the dedicated host coverage, race, and clean-host integration gates
      - pattern: "deployment/**"
        reason: deployment security paths are enforced by the dedicated host coverage, race, and clean-host integration gates
      - pattern: "internal/config/client/**"
        reason: deployment client discovery is enforced by the dedicated host coverage, race, and clean-host integration gates
      - pattern: "internal/host/**"
        reason: host lifecycle code is enforced by the dedicated host coverage, race, and clean-host integration gates
      - pattern: "internal/pairing/**"
        reason: pairing lifecycle code is enforced by the dedicated host coverage and race gates
      - pattern: "internal/terminal/setup/**"
        reason: interactive setup is enforced by focused unit, accessibility, and pseudo-terminal race tests
      - pattern: "internal/userinstall/**"
        reason: user installation publication is enforced by the dedicated host coverage and integration gates
      - pattern: "setup/**"
        reason: guided setup is enforced by the dedicated host coverage, race, and clean-host integration gates
      - pattern: "cmd/git-credential-unyolo/**"
        reason: the process entrypoint only delegates to the tested git/client package
      - pattern: "internal/storage/state/internal/dbsql/**"
        reason: deterministic sqlc-generated database bindings are checked by the pinned generation gate
      - pattern: "broker/conformance/**"
        reason: reusable black-box test harness code is exercised by consumer repositories rather than shipped at runtime
      - pattern: protocol/operatorwire/generated.go
        reason: Generated clients and Echo bindings intentionally repeat protocol boilerplate.
      - pattern: protocol/agentwire/generated.go
        reason: Generated clients and Echo bindings intentionally repeat protocol boilerplate.
    structural:
      enabled: true
      threshold: 0.82
      min_lines: 4
      min_nodes: 20
    copied_blocks:
      enabled: true
      min_tokens: 100
  crap:
    max_score: 8
  mutation:
    exclude:
      - pattern: protocol/operatorwire/generated.go
        reason: Generated code is tested through protocol conformance rather than mutation.
      - pattern: protocol/agentwire/generated.go
        reason: Generated code is tested through protocol conformance rather than mutation.
