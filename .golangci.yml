version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - ineffassign
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    cyclop:
      max-complexity: 10
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      severity: error
      rules:
        - name: file-length-limit
          arguments:
            - max: 800
              skip-comments: true
              skip-blank-lines: true
          exclude:
            - "**/*_test.go"
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - bodyclose
          - cyclop
          - gosec
          - noctx
      - path: "^brokers/(github/internal/httpapi/server|huggingface/internal/(httpapi/server|isolation/isolation|policy/policy))\\.go$"
        linters:
          - revive
      - path: "^brokers/sudo/"
        linters:
          - cyclop
      - path: "^broker/conformance/"
        linters:
          - cyclop

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
